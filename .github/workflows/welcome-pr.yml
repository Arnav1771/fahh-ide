name: Welcome Contributors

on:
  pull_request_target:
    types: [ opened ]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Greet Contributor
        uses: actions/github-script@v7
        with:
          script: |
            const creator = context.payload.sender.login;
            const issue_number = context.payload.pull_request.number;
            const message = `👋 Welcome @${creator}!\n\nThank you for contributing to this project. CI is now running the TypeScript and Rust checks on your change.\n\n- Please make sure \`pnpm test\` and \`cargo test\` (in src-tauri) pass\n- Adhere to the conventions outlined in [CONTRIBUTING.md](./CONTRIBUTING.md)\n\nA maintainer will review your pull request shortly! 🚀`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: message
            });
