name: Test build (all platforms)

# Test installers only: no release, no tag. Runs on branches named winbuild/... or testbuild/...
on:
  push:
    branches: ["winbuild/**", "testbuild/**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: ""
          - platform: ubuntu-22.04
            label: linux-x64
            args: ""
          - platform: macos-latest
            label: macos-arm64
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
          - platform: macos-latest
            label: macos-x64
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev librsvg2-dev patchelf libayatana-appindicator3-dev
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install pnpm
        run: npm install -g pnpm@9
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build installers
        run: pnpm exec tauri build ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: fahh-${{ matrix.label }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/appimage/*.AppImage
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/dmg/*.dmg
