name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # Create the GitHub Release once. Uses find-or-create so re-runs are safe.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.find-or-create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Find or create GitHub Release
        id: find-or-create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : '${{ inputs.tag }}';

            // Try to find an existing release for this tag
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                tag,
              });
              core.setOutput('release_id', existing.data.id);
              console.log('Found existing release id', existing.data.id);
              return;
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            // No existing release — create one. Notes come from release-notes/<tag>.md
            // when it exists; otherwise GitHub generates them from the merged PRs.
            const fs = require('fs');
            const notesFile = `release-notes/${tag}.md`;
            const hasNotes = fs.existsSync(notesFile);
            const body = hasNotes ? fs.readFileSync(notesFile, 'utf8') : '';
            console.log(hasNotes ? `Using ${notesFile}` : `No ${notesFile}; generating notes from PRs`);

            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name:   tag,
              name:       'Fahh Editor ' + tag,
              draft:      false,
              prerelease: false,
              body,
              generate_release_notes: !hasNotes,
            });
            core.setOutput('release_id', release.data.id);
            console.log('Created release id', release.data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
            label: linux-x64
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust-target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust-target: x86_64-apple-darwin
            label: macos-x64
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            rust-target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-on-failure: true

      - name: Install frontend deps
        run: pnpm install

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # Every installer is up: email newsletter subscribers about this release (Fahh Cloud mails each
  # version once). Skipped until the FAHH_BROADCAST_KEY repository secret is set.
  announce:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Email subscribers
        env:
          KEY: ${{ secrets.FAHH_BROADCAST_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if [ -z "$KEY" ]; then echo "FAHH_BROADCAST_KEY is not set: no release email."; exit 0; fi
          curl -fsS -X POST "https://br-floral-mountain-b7yj9n4w-fahhapi.compute.c-13.us-east-1.aws.neon.tech/v1/broadcast" \
            -H "content-type: application/json" -H "x-broadcast-key: $KEY" \
            -d "{\"version\":\"$TAG\"}"
