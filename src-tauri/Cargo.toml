[package]
name = "fahh-editor"
version = "0.6.4"
edition = "2021"
description = "Fahh Editor — a Tauri 2 desktop IDE"
license = "MIT"
default-run = "fahh-editor"

[[bin]]
name = "fahh-editor"
path = "src/main.rs"

[[bin]]
name = "fahh-agent"
path = "src/bin/fahh-agent.rs"

[lib]
name = "fahh_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Rust syntax check (core/syntax.rs); span-locations gives line/column outside a proc macro
syn = { version = "2", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6"
notify-debouncer-mini = "0.4"
dirs = "5"
walkdir = "2"
which = "6"
lazy_static = "1"
git2 = { version = "0.19", default-features = false }
# Fahh Local: provider HTTP + streaming, and the search tool
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
regex = "1"
# Real terminals (ConPTY on Windows)
portable-pty = "0.9"
# Colour themes from Open VSX (.vsix is a zip)
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
